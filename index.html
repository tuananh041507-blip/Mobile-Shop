<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Mobile Shop - Cửa hàng điện thoại</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- ===== PHẦN ĐẦU TRANG ===== -->
        <div class="header">
            <h1 class="logo">Mobile Shop</h1>
            <ul class="menu">
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Sản phẩm</a></li>
                <li><a href="#">Giới thiệu</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
            <div class="clear"></div>
        </div>
        <!-- ===== BANNER ===== -->
        <div class="banner">
            <h2>Khuyến mãi tháng 11</h2>
            <p>Giảm giá đến 30% cho tất cả các dòng điện thoại</p>
            <a href="#" class="btn">Xem ngay</a>
        </div>
        <!-- ===== DANH SÁCH SẢN PHẨM ===== -->
        <div class="content">
            <h2 class="title">Sản phẩm nổi bật</h2>
            <div class="product">
                <img src="images/sp1.png" alt="Điện thoại A1">
                <h3>Điện thoại A1</h3>
                <p class="price">5.990.000 đ</p>
                <a href="#" class="buy">Mua ngay</a>
            </div>
        </div>

</body>

</html>
